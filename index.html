<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SortLab</title><style>:root{--a:#a78bfa}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ SortLab<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Visualizer</a><a href="?view=1">Algorithms</a><a href="?view=2">History</a><a href="?view=3">About</a></nav></header><main id="app"></main><script>let arr=JSON.parse(localStorage.arr||'[42,18,75,33,61,27,88,51,14,69,36,94]'),hist=JSON.parse(localStorage.algoHist||'[]');function save(){localStorage.arr=JSON.stringify(arr);localStorage.algoHist=JSON.stringify(hist)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>Make sorting visible.</h1><p>Shuffle dan jalankan Bubble Sort secara live.</p><div class="chart">'+arr.map(x=>'<i style="height:'+x+'%"></i>').join('')+'</div><button onclick="run()">▶ Visualize</button><button onclick="shuffle()">Shuffle</button>':v===1?'<h1>Algorithms</h1><div class="grid"><div><b>Bubble Sort</b><p>Stable · O(n²)</p></div><div><b>Insertion Sort</b><p>Stable · O(n²)</p></div><div><b>Quick Sort</b><p>Average O(n log n)</p></div></div>':v===2?'<h1>History</h1>'+hist.map(x=>'<div class="card">'+x+'</div>').join(''):'<h1>About</h1><p>Browser visualizer untuk konsep algoritma pada source C++.</p>'}async function run(){let c=0,s=0;for(let i=0;i<arr.length;i++)for(let j=0;j<arr.length-i-1;j++){c++;if(arr[j]>arr[j+1]){[arr[j],arr[j+1]]=[arr[j+1],arr[j]];s++}render();await new Promise(r=>setTimeout(r,50))}hist.unshift('Bubble Sort · '+arr.length+' values · '+c+' comparisons · '+s+' swaps');save();render()}function shuffle(){arr.sort(()=>Math.random()-.5);save();render()}render();</script></body></html>
